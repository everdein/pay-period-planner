# cspell:ignore isready Ppostgres
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Principle of least privilege for default actions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-verification:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend dependency compatibility
        working-directory: frontend
        run: npm run check:dependency-compat

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test -- --coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install root tool dependencies
        run: npm ci

      - name: Run cspell
        run: npm run spell

      - name: Validate public documentation corpus
        shell: pwsh
        run: ./scripts/check-public-corpus.ps1

  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend formatting
        working-directory: backend
        run: |
          chmod +x mvnw || true
          ./mvnw -B spotless:check sortpom:verify

      - name: Build backend
        working-directory: backend
        run: |
          chmod +x mvnw || true
          ./mvnw -B clean verify

      - name: Upload backend coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: error

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PASSWORD: financial_app_password
      DATABASE_URL: jdbc:postgresql://localhost:5432/financial_app
      DATABASE_USERNAME: financial_app_user
      RUN_POSTGRES_INTEGRATION_TESTS: 'true'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: financial_app
          POSTGRES_PASSWORD: financial_app_password
          POSTGRES_USER: financial_app_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial_app_user -d financial_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run isolated PostgreSQL integration tests
        working-directory: backend
        run: |
          chmod +x mvnw || true
          ./mvnw -B test -Ppostgres-integration -Djacoco.skip=true

  browser-ux:
    name: Browser & UX
    runs-on: ubuntu-latest
    needs: [frontend-verification, build-backend]
    timeout-minutes: 15
    env:
      BROWSER_TEST_SCHEMA: financials_browser_ci
      DATABASE_PASSWORD: financial_app_password
      DATABASE_USERNAME: financial_app_user
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: financial_app
          POSTGRES_PASSWORD: financial_app_password
          POSTGRES_USER: financial_app_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial_app_user -d financial_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run complete live browser suite
        working-directory: frontend
        run: |
          chmod +x ../backend/mvnw || true
          npm run test:e2e -- --project chromium

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [frontend-verification, build-backend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download frontend coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Download backend coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

      - name: Write coverage summary packet
        shell: pwsh
        run: ./scripts/write-coverage-summary.ps1

  snyk-security:
    name: Snyk Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Check Snyk CLI token availability
        id: snyk-token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "${SNYK_TOKEN}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "available=false" >> "${GITHUB_OUTPUT}"

          if [ "${GITHUB_ACTOR}" = "dependabot[bot]" ]; then
            echo "::warning title=Snyk CLI scan skipped::SNYK_TOKEN is unavailable to Dependabot-triggered workflows. Review the repository Snyk PR check and rerun the CI workflow manually if CLI confirmation is required."
            exit 0
          fi

          echo "::error title=Snyk CLI scan unavailable::SNYK_TOKEN is not configured for this workflow run."
          exit 1

      - name: Install Snyk CLI
        if: steps.snyk-token.outputs.available == 'true'
        id: snyk-cli
        run: |
          version="$(tr -d '[:space:]' < .snyk-cli-version)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid Snyk CLI pin::.snyk-cli-version must contain one semantic version."
            exit 1
          fi

          npm install -g "snyk@${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify Snyk CLI version
        if: steps.snyk-token.outputs.available == 'true'
        env:
          SNYK_CLI_VERSION: ${{ steps.snyk-cli.outputs.version }}
        run: |
          actual="$(snyk --version)"
          if [ "${actual}" != "${SNYK_CLI_VERSION}" ]; then
            echo "::error title=Snyk CLI version mismatch::Expected ${SNYK_CLI_VERSION}, received ${actual}."
            exit 1
          fi

          echo "Using pinned Snyk CLI ${actual}."

      - name: Snyk test
        if: steps.snyk-token.outputs.available == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high

  scans:
    name: Scans
    runs-on: ubuntu-latest
    if: always()
    needs:
      - browser-ux
      - build-backend
      - coverage-summary
      - frontend-verification
      - postgres-integration
      - snyk-security
      - spell-check
    env:
      BACKEND_RESULT: ${{ needs.build-backend.result }}
      BROWSER_RESULT: ${{ needs.browser-ux.result }}
      COVERAGE_RESULT: ${{ needs.coverage-summary.result }}
      FRONTEND_RESULT: ${{ needs.frontend-verification.result }}
      POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
      SECURITY_RESULT: ${{ needs.snyk-security.result }}
      SPELL_RESULT: ${{ needs.spell-check.result }}
    steps:
      - name: Enforce complete CI gate
        run: |
          declare -A results=(
            [frontend]="${FRONTEND_RESULT}"
            [spell]="${SPELL_RESULT}"
            [backend]="${BACKEND_RESULT}"
            [postgres]="${POSTGRES_RESULT}"
            [browser]="${BROWSER_RESULT}"
            [coverage]="${COVERAGE_RESULT}"
            [security]="${SECURITY_RESULT}"
          )

          failed=false
          {
            echo "## Complete CI gate"
            echo ""
            for check in frontend spell backend postgres browser coverage security; do
              result="${results[$check]}"
              echo "- ${check}: \`${result}\`"
              if [ "${result}" != "success" ]; then
                failed=true
              fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${failed}" = "true" ]; then
            echo "::error title=CI gate failed::One or more required verification jobs did not succeed."
            exit 1
          fi

          echo "All required verification jobs succeeded."
