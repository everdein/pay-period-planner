name: Weekly Maintenance Review

on:
  schedule:
    - cron: '15 7 * * 1'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
    inputs:
      base_commit:
        description: 'Optional full ancestor commit SHA for bounded catch-up; empty uses the normal seven-day window'
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  weekly-maintenance:
    name: Weekly maintenance packet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate independent weekly packets
        id: packets
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          CATCH_UP_BASE: ${{ inputs.base_commit }}
        run: |
          $arguments = @{ OutputDirectory = "$env:RUNNER_TEMP/maintenance-packets" }
          if (-not [string]::IsNullOrWhiteSpace($env:CATCH_UP_BASE)) { $arguments.BaseRef = $env:CATCH_UP_BASE }
          ./scripts/generate-maintenance-packets.ps1 @arguments

      - name: Setup Node.js
        id: node
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        id: root-install
        if: always() && steps.node.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Install frontend dependencies
        id: frontend-install
        if: always() && steps.node.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        run: npm ci

      - name: Verify maintenance packet regressions
        id: packet-tests
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/test-maintenance-packets.ps1

      - name: Spell check
        id: spell
        if: always() && steps.root-install.outcome == 'success'
        continue-on-error: true
        run: npm run spell

      - name: Root dependency audit
        id: root-audit
        if: always() && steps.root-install.outcome == 'success'
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Frontend dependency audit
        id: frontend-audit
        if: always() && steps.frontend-install.outcome == 'success'
        continue-on-error: true
        run: npm --prefix frontend audit --audit-level=high

      - name: Recent CI runs
        id: recent-ci
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Recent CI runs"
            echo ""
            gh run list --repo "${REPOSITORY}" --workflow "CI" --limit 5
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain sanitized maintenance packets
        id: artifacts
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-packets
          path: |
            ${{ runner.temp }}/maintenance-packets/*.md
            ${{ runner.temp }}/maintenance-packets/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce maintenance completion and security policy
        if: always()
        shell: pwsh
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          $outcomes = $env:STEP_OUTCOMES | ConvertFrom-Json
          $required = @('checkout', 'packets', 'node', 'root-install', 'frontend-install', 'packet-tests', 'spell', 'root-audit', 'frontend-audit', 'recent-ci', 'artifacts')
          $failed = @($required | Where-Object { $outcomes.$_.outcome -ne 'success' })
          $summary = @('## Maintenance completion policy', '', 'High-or-critical dependency findings fail this review. Failed or skipped diagnostics are incomplete, not clean.', '')
          foreach ($name in $required) { $summary += "- ${name}: $($outcomes.$name.outcome)" }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($failed.Count -gt 0) { throw 'Maintenance review incomplete or failed; inspect the named steps and retained packets.' }
